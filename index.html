function beat(){try{const A=ac(),t0=A.currentTime+.05,b=60/150,B=[55,55,65.4,49];
for(let n=0;n<32;n++){const t=t0+n*b/2,G=A.createGain();G.connect(A.destination);
if(n%2==0){const o=A.createOscillator();o.frequency.setValueAtTime(170,t);o.frequency.exponentialRampToValueAtTime(40,t+.14);G.gain.setValueAtTime(.9,t);G.gain.exponentialRampToValueAtTime(.001,t+.24);o.connect(G);o.start(t);o.stop(t+.26)}

function bar(){return `${PK()}<div class="bar"><button class="g ib" onclick="$('fu').click()">${ic('clip')}</button><input id="fu" type="file" hidden onchange="upFile(this.files[0],'file')"><button class="g ib" onclick="S.pk=S.pk=='gif'?0:'gif';rr();if(S.pk=='gif')gsearch('')">${ic('smile')}</button><button class="g ib" onclick="S.pk=S.pk=='song'?0:'song';rr()">${ic('music')}</button><input id="ci" placeholder="Message" onpaste="pst(event)" onkeydown="if(event.key=='Enter')send()"><button class="ib" onclick="send()">${ic('send')}</button></div>`}
function chatUI(){const dv=($('ci')||{}).value||'';$('app').innerHTML=`<div class="top"><button class="g ib" onclick="S.peer=null;R()">${ic('back')}</button><span onclick="viewProf('${S.peer.id}')">${av(S.peer,34)}</span><b>${esc(S.peer.name)}</b><button class="ib" onclick="callPeer()">${ic('phone')}</button><button class="g ib" onclick="blockU()">${ic('block')}</button></div><div class="msgs" id="ms">${S.msgs.map(m=>`<div class="m ${m.from_id==me.id?'me':''}">${mh(m)}</div>`).join('')||'<p class="sm">Hi bolo 👋 (friend banne se pehle sirf 3 messages)</p>'}</div>${bar()}`;const e=$('ms');e.scrollTop=e.scrollHeight;$('ci').value=dv}
const fsz=n=>n>1e6?(n/1e6).toFixed(1)+' MB':Math.max(1,Math.round(n/1e3))+' KB';
function mhx(t){
if(t.startsWith('::gif:https://')){const u=t.slice(6);return OKU(u)?`<img src="${esc(u)}" loading="lazy">`:''}
if(t.startsWith('::aud:')){const[u,n]=t.slice(6).split('|');return OKU(u)?`<div class="sm">🎵 ${esc(n||'Song')}</div><audio controls src="${esc(u)}"></audio>`:''}
if(t.startsWith('::call:')){const r=t.slice(7);return /^[\w-]{3,100}$/.test(r)?`<button class="g" onclick="join('${r}','📞 Call')">📞 Join call</button>`:''}
if(t.startsWith('::file:')){const[u,n,z]=t.slice(7).split('|');return OKU(u)?`<a class="fc" href="${esc(u)}?download=${encodeURIComponent(n||'file')}" download><span class="fi">${ic('file',22)}</span><span class="f"><b>${esc(n||'file')}</b><span class="sm" style="display:block">${fsz(+z||0)}</span></span>${ic('download',20)}</a>`:''}
if(t.startsWith('::inv:')){const[c,n]=t.slice(6).split('|');return /^\w{6,12}$/.test(c)?`<div class="sm">Server invite</div><b>${esc(n||'Server')}</b><br><button style="margin-top:6px" onclick="joinSrv('${c}')">Join</button>`:''}
return''}
async function upFile(f,kind){if(!f)return;const ok={img:'image/',aud:'audio/'}[kind];if(ok&&!f.type.startsWith(ok))return T('Galat file type');if(f.size>(kind=='file'?2e7:kind=='aud'?9e6:5e6))return T('File bahut badi hai (max 20MB)');
const ext=(f.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5),p=`${me.id}/${Date.now()}.${ext}`;T('Upload ho raha hai...');
const{error}=await sb.storage.from('media').upload(p,f,{contentType:f.type||'application/octet-stream'});if(error)return T('Upload fail: '+error.message);
const u=sb.storage.from('media').getPublicUrl(p).data.publicUrl,n=f.name.slice(0,40).replace(/\|/g,'');
await send(kind=='file'?`::file:${u}|${n}|${f.size}`:kind=='aud'?`::aud:${u}|${n}`:`::gif:${u}`)}
async function send(raw){const t=typeof raw=='string'?raw:$('ci').value.trim();if(!t)return;
if(S.srv){if(!S.srv.ch)return;const{data,error}=await sb.from('server_messages').insert({server_id:S.srv.id,channel_id:S.srv.ch.id,from_id:me.id,body:t}).select().single();if(error)return T('Message nahi gaya');S.pk=0;S.srv.msgs.push(data);return srvUI()}
const{data,error}=await sb.from('messages').insert({from_id:me.id,to_id:S.peer.id,body:t}).select().single();if(error)return T(/3/.test(error.message)?error.message:'Message nahi gaya');if(t.startsWith('::gif'))S.pk=0;S.pk=0;S.msgs.push(data);chatUI()}
const sav=(v,z=44)=>{const pc=okp(v.icon);return `<div class="av sq" style="width:${z}px;height:${z}px;font-size:${z/2.4}px;${pc?`background-image:url(${v.icon})`:''}">${pc?'':esc((v.name||'?')[0].toUpperCase())}</div>`};
const can=p=>S.srv.role=='owner'||(S.srv.perms||[]).includes(p);
async function srvTab(pg){const{data}=await sb.from('server_members').select('role,server:servers(id,name,icon)').eq('user_id',me.id);
pg.innerHTML=`<h2>Servers</h2><div class="vg"><button onclick="mkSrv()">${ic('plus',18)} Create server</button><button class="g" onclick="joinBox()">${ic('link',18)} Join with code</button></div>`+(data||[]).filter(x=>x.server).map(x=>`<div class="row" onclick="openSrv(${x.server.id})">${sav(x.server,46)}<div class="f"><b>${esc(x.server.name)}</b><div class="sm">${x.role}</div></div></div>`).join('')}
function mkSrv(){modal(`<h3 style="margin-top:0">Create server</h3><input id="sn" placeholder="Server name" maxlength="24"><button style="width:100%" onclick="doMk()">Create</button>`)}
async function doMk(){const n=$('sn').value.trim();if(!n)return;const{data:v,error}=await sb.from('servers').insert({name:n.slice(0,24),owner:me.id}).select().single();if(error)return T('Server nahi bana');
await sb.from('server_members').insert({server_id:v.id,user_id:me.id,role:'owner'});await sb.from('channels').insert([{server_id:v.id,name:'general',kind:'text'},{server_id:v.id,name:'Voice Lounge',kind:'voice'}]);cm();T('Server ban gaya');openSrv(v.id)}
function joinBox(){modal(`<h3 style="margin-top:0">Join server</h3><p class="sm">Invite code ya link paste karo</p><input id="jc" placeholder="Invite code / link"><button style="width:100%" onclick="joinSrv($('jc').value)">Join</button>`)}
async function joinSrv(c){c=(c||'').trim().split('join=').pop().replace(/\W/g,'');if(!c)return;const{data,error}=await sb.rpc('join_server',{code:c});if(error)return T(error.message);cm();T('Server join ho gaya!');S.tab='srv';openSrv(data)}
function procJoin(){const c=sessionStorage.getItem('exj');if(c){sessionStorage.removeItem('exj');setTimeout(()=>joinSrv(c),1500)}}
async function openSrv(id){cm();const[{data:v},{data:chs},{data:mb}]=await Promise.all([sb.from('servers').select('*').eq('id',id).single(),sb.from('channels').select('*').eq('server_id',id).order('id'),sb.from('server_members').select('user_id,role,perms,p:profiles(id,username,name,pic,anim)').eq('server_id',id)]);
if(!v)return T('Server nahi mila');const my=(mb||[]).find(x=>x.user_id==me.id)||{role:'member',perms:[]};
S.srv={...v,role:my.role,perms:my.perms||[],chs:chs||[],mem:mb||[],ch:null,msgs:[]};S.peer=null;
if(ch)sb.removeChannel(ch);ch=sb.channel('s'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'server_messages',filter:'server_id=eq.'+id},p=>{const m=p.new;if(S.srv&&S.srv.id==id&&m.from_id!=me.id&&S.srv.ch&&S.srv.ch.id==m.channel_id){S.srv.msgs.push(m);srvUI()}}).on('postgres_changes',{event:'DELETE',schema:'public',table:'server_messages'},p=>{if(S.srv){S.srv.msgs=S.srv.msgs.filter(x=>x.id!=p.old.id);srvUI()}}).subscribe();
const t=S.srv.chs.find(c=>c.kind=='text')||S.srv.chs[0];await pickCh(t?t.id:0)}
async function pickCh(cid){const v=S.srv;v.ch=v.chs.find(c=>c.id==cid)||null;v.msgs=[];S.pk=0;if(v.ch&&v.ch.kind=='text')v.msgs=(await sb.from('server_messages').select('*').eq('server_id',v.id).eq('channel_id',cid).order('created_at').limit(100)).data||[];srvUI()}
function voiceBox(){const c=S.srv.ch,room='vc-'+c.id,on=S.room==room;return `<div class="pg" style="text-align:center"><div style="margin:20px">${ic('speaker',56)}</div><h2>${esc(c.name)}</h2><p class="sm">${c.user_limit?'Limit: '+c.user_limit+' log':'No limit (99+ log)'}</p>${on?`<p>${ic('mic',16)} Connected · ${S.n}</p><button onclick="S.big=1;cbar()">Open call</button> <button class="r" onclick="leave()">Leave</button>`:`<button onclick="join('${room}','${esc(c.name).replace(/'/g,'')}')">Join voice</button>`}</div>`}
function srvUI(){const v=S.srv,dv=($('ci')||{}).value||'',nm=id=>{const m=v.mem.find(x=>x.user_id==id);return m?m.p.username:'?'};
const chip=c=>`<span class="chip ${v.ch&&v.ch.id==c.id?'on':''}" onclick="pickCh(${c.id})">${ic(c.kind=='voice'?'speaker':'hash',15)} ${esc(c.name)}</span>`;let body='';
if(v.ch&&v.ch.kind=='text')body=`<div class="msgs" id="ms">${v.msgs.map(m=>`<div class="m ${m.from_id==me.id?'me':''}"><div class="sm">@${esc(nm(m.from_id))}${m.from_id==me.id||can('delete_msgs')?`<span class="del" onclick="delMsg(${m.id})">${ic('trash',13)}</span>`:''}</div>${mh(m)}</div>`).join('')||'<p class="sm">Server mein swagat hai!</p>'}</div>${bar()}`;
else if(v.ch)body=voiceBox();else body='<p class="sm" style="padding:16px">Koi channel nahi.</p>';
$('app').innerHTML=`<div class="top"><button class="g ib" onclick="leaveView()">${ic('back')}</button>${sav(v,34)}<b>${esc(v.name)}</b>${can('invite')?`<button class="g ib" onclick="invBox()">${ic('link')}</button>`:''}<button class="g ib" onclick="setBox()">${ic('gear')}</button></div><div class="chips">${v.chs.map(chip).join('')}${can('channels')?`<span class="chip" onclick="chBox()">${ic('plus',15)}</span>`:''}</div>${body}`;const e=$('ms');if(e)e.scrollTop=e.scrollHeight;if($('ci'))$('ci').value=dv}
function leaveView(){S.srv=null;if(ch){sb.removeChannel(ch);ch=null}R()}
async function delMsg(id){const{error}=await sb.from('server_messages').delete().eq('id',id);if(error)return T('Delete nahi hua');S.srv.msgs=S.srv.msgs.filter(m=>m.id!=id);srvUI()}
function invBox(){const v=S.srv,l=location.origin+location.pathname+'?join='+v.invite_code;modal(`<h3 style="margin-top:0">Invite to ${esc(v.name)}</h3><p class="sm">Ye link kisi ko bhi bhejo. Link kholke login karte hi wo server join kar lega.</p><input id="il" value="${esc(l)}" readonly onclick="this.select()"><div class="vg"><button onclick="navigator.clipboard.writeText($('il').value).then(()=>T('Link copy ho gaya'))">${ic('link',16)} Copy link</button><button class="g" onclick="shareInv()">${ic('send',16)} Send to friends</button></div><p class="sm">Code: <b>${v.invite_code}</b></p>`)}
async function shareInv(){const fs=await friends();if(!fs.length)return T('Pehle friends banao');await sb.from('messages').insert(fs.map(f=>({from_id:me.id,to_id:f.id,body:`::inv:${S.srv.invite_code}|${S.srv.name.replace(/\|/g,'')}`})));T(fs.length+' friends ko invite bheja');cm()}
const PM=[['channels','Channels / VC manage'],['invite','Invite'],['kick','Kick members'],['delete_msgs','Delete messages']];
function setBox(){const v=S.srv,own=v.role=='owner',sel=(m,r,n)=>`<option value="${r}" ${m.role==r?'selected':''}>${n}</option>`;
modal(`<h3 style="margin-top:0">${own?'Customise server':'Server info'}</h3>
${own?`<div style="text-align:center">${sav(v,72)}</div><label class="lb">${ic('clip',16)} Change icon<input type="file" accept="image/*" hidden onchange="pick(this,x=>updSrv({icon:x}))"></label><input id="rn" value="${esc(v.name)}" maxlength="24"><button style="width:100%" onclick="updSrv({name:$('rn').value.trim()||S.srv.name})">Save name</button><button class="g" style="width:100%;margin-top:6px" onclick="updSrv({invite_code:Math.random().toString(36).slice(2,10)})">New invite code</button>`:''}
<h3>Channels</h3>${v.chs.map(c=>`<div class="row">${ic(c.kind=='voice'?'speaker':'hash',18)}<div class="f"><b>${esc(c.name)}</b>${c.kind=='voice'?`<div class="sm">Limit: ${c.user_limit||'no limit'}</div>`:''}</div>${can('channels')?`<button class="g ib" onclick="chBox(${c.id})">${ic('gear',16)}</button>`:''}</div>`).join('')}
<h3>Members (${v.mem.length})</h3>${v.mem.map(m=>`<div class="row">${av(m.p,34)}<div class="f"><b>${esc(m.p.name)}</b><div class="sm">@${m.p.username} · ${m.role}</div>${own&&m.role!='owner'?`<select onchange="setRole('${m.user_id}',this.value)" style="float:none">${sel(m,'member','Member')}${sel(m,'mod','Moderator')}${sel(m,'admin','Admin')}</select>${PM.map(p=>`<label class="sm" style="display:block"><input type="checkbox" style="width:auto;margin:2px" ${(m.perms||[]).includes(p[0])?'checked':''} onchange="setPerm('${m.user_id}','${p[0]}',this.checked)"> ${p[1]}</label>`).join('')}`:''}</div>${can('kick')&&m.role!='owner'&&m.user_id!=me.id?`<button class="r ib" onclick="kick('${m.user_id}')">${ic('x',16)}</button>`:''}</div>`).join('')}
${own?`<button class="r" style="width:100%;margin-top:10px" onclick="delSrv()">Delete server</button>`:`<button class="r" style="width:100%;margin-top:10px" onclick="leaveSrv()">Leave server</button>`}`)}
async function updSrv(o){const{error}=await sb.from('servers').update(o).eq('id',S.srv.id);if(error)return T('Update nahi hua');Object.assign(S.srv,o);T('Saved');setBox();srvUI()}
async function setRole(u,role){const perms={admin:['channels','invite','kick','delete_msgs'],mod:['kick','delete_msgs'],member:[]}[role];const{error}=await sb.from('server_members').update({role,perms}).eq('server_id',S.srv.id).eq('user_id',u);if(error)return T('Nahi hua');const m=S.srv.mem.find(x=>x.user_id==u);m.role=role;m.perms=perms;setBox()}
async function setPerm(u,p,on){const m=S.srv.mem.find(x=>x.user_id==u),perms=on?[...new Set([...(m.perms||[]),p])]:(m.perms||[]).filter(x=>x!=p);const{error}=await sb.from('server_members').update({perms}).eq('server_id',S.srv.id).eq('user_id',u);if(error)return T('Nahi hua');m.perms=perms}
async function kick(u){const{error}=await sb.rpc('kick_member',{s:S.srv.id,u});if(error)return T(error.message);S.srv.mem=S.srv.mem.filter(x=>x.user_id!=u);setBox()}
async function delSrv(){if(!confirm('Server delete kar dein? Ye wapas nahi aayega.'))return;const{error}=await sb.from('servers').delete().eq('id',S.srv.id);if(error)return T('Delete nahi hua');cm();leaveView();T('Server delete ho gaya')}
async function leaveSrv(){if(!confirm('Server chhod dein?'))return;await sb.from('server_members').delete().eq('server_id',S.srv.id).eq('user_id',me.id);cm();leaveView()}
function chBox(id){const c=id?S.srv.chs.find(x=>x.id==id):null;cm();modal(`<h3 style="margin-top:0">${c?'Edit channel':'New channel'}</h3><input id="cn" placeholder="Channel name" maxlength="24" value="${c?esc(c.name):''}">${c?'':`<select id="ck" style="float:none;width:100%;margin:6px 0" onchange="$('cl').style.display=this.value=='voice'?'block':'none'"><option value="text">Text channel</option><option value="voice">Voice channel (VC)</option></select>`}<input id="cl" type="number" min="0" max="999" placeholder="Max people in VC (0 = no limit)" value="${c?c.user_limit:''}" style="display:${c&&c.kind=='voice'?'block':'none'}"><button style="width:100%" onclick="saveCh(${id||0})">Save</button>${c?`<button class="r" style="width:100%;margin-top:6px" onclick="delCh(${id})">Delete channel</button>`:''}`)}
async function saveCh(id){const n=$('cn').value.trim().slice(0,24);if(!n)return;const lim=Math.max(0,Math.min(999,+($('cl').value||0)));
if(id){const c=S.srv.chs.find(x=>x.id==id),o={name:n};if(c.kind=='voice')o.user_limit=lim;const{error}=await sb.from('channels').update(o).eq('id',id);if(error)return T('Nahi hua');Object.assign(c,o)}
else{const k=$('ck').value,{data,error}=await sb.from('channels').insert({server_id:S.srv.id,name:n,kind:k,user_limit:k=='voice'?lim:0}).select().single();if(error)return T('Channel nahi bana');S.srv.chs.push(data)}cm();srvUI()}
async function delCh(id){if(!confirm('Channel delete karein?'))return;await sb.from('channels').delete().eq('id',id);S.srv.chs=S.srv.chs.filter(c=>c.id!=id);cm();if(S.srv.ch&&S.srv.ch.id==id){const t=S.srv.chs[0];return pickCh(t?t.id:0)}srvUI()}
['join','leave'].forEach(n=>{const f=window[n];window[n]=async function(){const r=await f.apply(this,arguments);if(S.srv&&S.srv.ch&&S.srv.ch.kind=='voice')srvUI();return r}});
function callScreen(){const o=$('cs');if(o)o.remove();if(!S.room||!S.big)return;const d=document.createElement('div');d.id='cs';d.className='callscr';
d.innerHTML=`<button class="g ib mini" onclick="S.big=0;cbar()">${ic('down')}</button><div class="rg">${S.cp?av(S.cp,120):`<div class="av" style="width:120px;height:120px">${ic('speaker',54)}</div>`}</div><h2>${esc((S.rl||S.room).replace('📞 ',''))}</h2><p class="sm">${S.n>1?'🟢 '+S.n+' in call':'Calling… waiting for others'}</p><p class="sm" style="margin-top:14px">Voice changer</p>
<div class="vg" style="justify-content:center;margin:6px 0 24px">${['normal','robot','echo','alien'].map(f=>`<button class="${S.fx==f?'':'g'}" onclick="S.fx='${f}';wire();callScreen()">${f}</button>`).join('')}</div>
<div class="vg" style="gap:30px;justify-content:center"><button class="cb ${S.mute?'red':'g'}" onclick="mute()">${ic(S.mute?'micoff':'mic',28)}</button><button class="cb red" onclick="leave()">${ic('phone',28)}</button></div>`;document.body.append(d)}
boot();
</script></body></html>
