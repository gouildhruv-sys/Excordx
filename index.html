function vcTab(){const pg=$('pg');if(!S.room){pg.innerHTML='<h2>Voice rooms</h2><p class="sm">Ek room mein 99+ log.</p>'+ROOMS.map(r=>`<div class="row"><div class="f"><b>${r}</b></div><button onclick="join('${r}')">Join</button></div>`).join('');return}
pg.innerHTML=`<h2>🎙️ ${S.room}</h2><p>${S.n} log room mein hain</p><h3>Voice changer</h3><div class="vg">${['normal','robot','echo','alien'].map(f=>`<button class="${S.fx==f?'':'g'}" onclick="S.fx='${f}';wire();vcTab()">${f}</button>`).join('')}</div><br><div class="vg"><button class="g" onclick="mute()">${S.mute?'Unmute':'Mute'}</button><button onclick="inv()">Invite friends</button><button class="r" onclick="leave()">Leave</button></div>`}
async function join(name){try{const{data,error}=await sb.functions.invoke('lk-token',{body:{room:name}});if(error)throw error;const A=ac();await A.resume();lk=new LivekitClient.Room();const up=()=>{S.n=lk.remoteParticipants.size+1;if(S.tab=='vc'&&!S.peer&&!S.srv)vcTab()};
lk.on('trackSubscribed',t=>{if(t.kind=='audio')document.body.append(t.attach())}).on('participantConnected',up).on('participantDisconnected',up);await lk.connect(LK_URL,data.token);
S.st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});S.src=A.createMediaStreamSource(S.st);S.dst=A.createMediaStreamDestination();S.fx='normal';wire();S.mt=new LivekitClient.LocalAudioTrack(S.dst.stream.getAudioTracks()[0]);await lk.localParticipant.publishTrack(S.mt);S.room=name;S.mute=0;up();vcTab()}catch(e){T('Voice error: '+(e.message||e))}}
function wire(){if(!S.src)return;S.src.disconnect();try{S.osc&&S.osc.stop()}catch(e){}const A=AC,fx=S.fx;
if(fx=='normal')S.src.connect(S.dst);
else if(fx=='echo'){const d=A.createDelay(1),f=A.createGain();d.delayTime.value=.25;f.gain.value=.45;S.src.connect(S.dst);S.src.connect(d);d.connect(f);f.connect(d);d.connect(S.dst)}
else{const g=A.createGain();g.gain.value=0;S.osc=A.createOscillator();S.osc.frequency.value=fx=='robot'?50:300;S.osc.connect(g.gain);S.osc.start();S.src.connect(g);g.connect(S.dst)}}
function mute(){S.mute=!S.mute;S.mute?S.mt.mute():S.mt.unmute();vcTab()}
async function inv(){const fs=await friends();if(!fs.length)return T('Pehle friends banao');await sb.from('messages').insert(fs.map(f=>({from_id:me.id,to_id:f.id,body:'🎙️ Join me in voice room: '+S.room})));T(fs.length+' friends ko invite bheja')}
function leave(){try{lk.disconnect();S.st.getTracks().forEach(t=>t.stop())}catch(e){}document.querySelectorAll('audio').forEach(a=>a.remove());S.room=null;S.src=null;vcTab()}
async function meUI(pg){const own=me.owned||[],bl=(me.blocked||[]).length?(await sb.from('profiles').select('id,username').in('id',me.blocked)).data||[]:[];
pg.innerHTML=`<div class="ban ${cl(me.ban)||'b-none'}"></div><div class="pc"><div style="margin-top:-36px">${av(me,76)}</div><h2 style="margin:10px 0 0">${esc(me.name)}</h2><div class="sm">@${me.username}</div><p>${esc(me.bio||'No description yet')}</p>${/^https?:\/\//.test(me.link||'')?`<a class="sm" href="${esc(me.link)}" target="_blank" rel="noopener">🔗 ${esc(me.link)}</a>`:''}</div>
<h3>Edit profile</h3><input id="pn" placeholder="Display name" value="${esc(me.name)}"><textarea id="pd" rows="2" placeholder="Description">${esc(me.bio||'')}</textarea><input id="pl" placeholder="Link (https://...)" value="${esc(me.link||'')}"><input type="file" accept="image/*" onchange="pick(this,async v=>{await sb.from('profiles').update({pic:v}).eq('id',me.id);me.pic=v;R()})"><button style="width:100%" onclick="saveMe()">Save profile</button>
<h3>Customization shop</h3>${SHOP.map(s=>{const o=own.includes(s[0]),eq=me.anim==s[0]||me.ban==s[0];return `<div class="row"><div class="f"><b>${s[1]}</b><div class="sm">${s[0][0]=='a'?'Profile picture animation':'Profile animation'}</div></div>${o?`<button class="${eq?'g':''}" onclick="equip('${s[0]}')">${eq?'Unequip':'Equip'}</button>`:`<button onclick="buy('${s[0]}')" ${me.cord<s[2]?'disabled':''}>🪙 ${s[2]}</button>`}</div>`}).join('')}
<h3>Privacy</h3><div class="row"><div class="f">Naye friend requests band karo</div><button class="${me.priv_noreq?'':'g'}" onclick="tp()">${me.priv_noreq?'ON':'OFF'}</button></div><div class="sm">Blocked: ${bl.map(u=>`@${u.username} <u onclick="unb('${u.id}')">unblock</u>`).join(', ')||'none'}</div>
<button class="r" style="width:100%;margin-top:14px" onclick="sb.auth.signOut().then(()=>location.reload())">Sign out</button>`}
async function saveMe(){const n=$('pn').value.trim()||me.name,b=$('pd').value.trim(),l=$('pl').value.trim();if(l&&!/^https?:\/\//.test(l))return T('Link https:// se shuru karo');const{error}=await sb.from('profiles').update({name:n,bio:b,link:l}).eq('id',me.id);if(error)return T('Save nahi hua');Object.assign(me,{name:n,bio:b,link:l});T('Saved');R()}
async function buy(i){const{data,error}=await sb.rpc('buy_item',{i});if(error)return T(error.message);me.cord=data;me.owned=[...(me.owned||[]),i];T('Unlocked!');R()}
async function equip(i){const k=i[0]=='a'?'anim':'ban',v=me[k]==i?'':i;const{error}=await sb.from('profiles').update({[k]:v}).eq('id',me.id);if(error)return T('Equip nahi hua');me[k]=v;R()}
async function tp(){me.priv_noreq=!me.priv_noreq;await sb.from('profiles').update({priv_noreq:me.priv_noreq}).eq('id',me.id);R()}
async function unb(id){me.blocked=me.blocked.filter(x=>x!=id);await sb.from('profiles').update({blocked:me.blocked}).eq('id',me.id);R()}
boot();
</script></body></html>
